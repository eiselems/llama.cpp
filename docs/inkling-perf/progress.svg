<circle class="m1" cx="157.2" cy="302.8" r="5"><title>S0 upstream master (no-op-offload, ub32, cache 2800) (afe77e18): 1k prompt 57.6 t/s, VRAM 6307 MiB</title></circle>
<circle class="m1" cx="343.8" cy="299.7" r="5"><title>S1 + MoE cache dedup (adishik 65dd939f) (2438cefc): 1k prompt 70.7 t/s, VRAM 6596 MiB</title></circle>
<circle class="m1" cx="530.2" cy="299.0" r="5"><title>S2 + fused glue ops + FA bias (#32740), same flags (4fb181db): 1k prompt 74.1 t/s, VRAM 6420 MiB</title></circle>
<circle class="m1" cx="716.8" cy="216.1" r="5"><title>S3 op-offload on (views fix), ub512, cache 3400 (4fb181db): 1k prompt 434.4 t/s, VRAM 7441 MiB</title></circle>
<text class="val" x="726.8" y="213.1">1k prompt 434.4</text>
<polyline class="l2" points="157.2,303.0 343.8,298.3 530.2,297.3 716.8,200.7"/>
<circle class="m2" cx="157.2" cy="303.0" r="5"><title>S0 upstream master (no-op-offload, ub32, cache 2800) (afe77e18): 4.8k prompt 56.4 t/s, VRAM 6307 MiB</title></circle>
<circle class="m2" cx="343.8" cy="298.3" r="5"><title>S1 + MoE cache dedup (adishik 65dd939f) (2438cefc): 4.8k prompt 77.1 t/s, VRAM 6596 MiB</title></circle>
<circle class="m2" cx="530.2" cy="297.3" r="5"><title>S2 + fused glue ops + FA bias (#32740), same flags (4fb181db): 4.8k prompt 81.5 t/s, VRAM 6420 MiB</title></circle>
<circle class="m2" cx="716.8" cy="200.7" r="5"><title>S3 op-offload on (views fix), ub512, cache 3400 (4fb181db): 4.8k prompt 501.3 t/s, VRAM 7441 MiB</title></circle>
<text class="val" x="726.8" y="205.7">4.8k prompt 501.3</text>
<text class="tick" x="810" y="76" text-anchor="end">1k prompt: 57.6 -> 434.4 (7.5x)</text>
