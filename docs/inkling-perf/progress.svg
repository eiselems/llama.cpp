<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" width="960" height="676" role="img" aria-label="Inkling-2-Mini prefill and decode speed per optimization step">
<style>
.bg { fill: #fcfcfb; }
text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #52514e; font-size: 12px; }
