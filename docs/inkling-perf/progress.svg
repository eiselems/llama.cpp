.m2 { fill: #eb6834; stroke: #fcfcfb; stroke-width: 2; }
.val { fill: #0b0b0b; font-size: 11px; font-weight: 600; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #1a1a19; }
  text { fill: #c3c2b7; }
  .title, .ptitle, .val { fill: #f0efec; }
  .tick { fill: #8f8e88; }
