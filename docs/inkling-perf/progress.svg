<text class="val" x="447.0" y="213.1">1k prompt 434.4</text>
<circle class="m2" cx="437.0" cy="200.7" r="5"><title>S3 op-offload on (views fix), ub512, cache 3400 (4fb181db): 4.8k prompt 501.3 t/s, VRAM 7441 MiB</title></circle>
